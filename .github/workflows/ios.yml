name: Build iOS IPA & Android APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    needs: android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version from run number
        run: |
          N=${{ github.run_number }}
          echo "VER=$((1 + N / 100)).$(((N / 10) % 10)).$((N % 10))" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --release --build-name=${{ env.VER }} --build-number=${{ github.run_number }} --dart-define=STN_UPLOAD_TOKEN=${{ secrets.STN_UPLOAD_TOKEN }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr SoThuNhap.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SoThuNhap-ipa
          path: SoThuNhap.ipa
      - run: cp SoThuNhap.ipa SoThuNhap-${{ env.VER }}-unsigned.ipa
      - name: Attach IPA to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: SoThuNhap-${{ env.VER }}-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version from run number
        run: |
          N=${{ github.run_number }}
          echo "VER=$((1 + N / 100)).$(((N / 10) % 10)).$((N % 10))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_B64" || { echo "Missing keystore secret"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" "$RUNNER_TEMP/release.jks" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --build-name=${{ env.VER }} --build-number=${{ github.run_number }} --dart-define=STN_UPLOAD_TOKEN=${{ secrets.STN_UPLOAD_TOKEN }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk SoThuNhap-${{ env.VER }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoThuNhap-apk
          path: SoThuNhap-${{ env.VER }}.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Sổ Thu Nhập ${{ env.VER }}
          body: |
            [show] Bản mới:
            • Cách tính công mới: tháng 31 ngày = 27 công, tháng 30 ngày và tháng 2 = 26 công; lương tính từ ngày 1 đến cuối tháng
            • Mỗi ngày tối đa 1 công: 1 chuyến Nội thành = 0,5 công, từ 2 chuyến = 1 công; có chuyến Nội vùng = 1 công
            • Ngày lễ theo quy định nhà nước (Tết Dương lịch, Tết Âm lịch, Giỗ Tổ, 30/4, 1/5, 2/9, 24/11) nghỉ vẫn được 1 công; đi làm ngày lễ: công ngày đó x3 (1 chuyến = 1,5; 2 chuyến = 3)
            • Lịch vận hành: ngày lễ tô màu tím; chạm vào một ngày để thêm hoặc bỏ ngày lễ nếu lịch thiếu
            • Dữ liệu chuyến cũ giữ nguyên, chỉ tính lại công theo cách mới
          files: SoThuNhap-${{ env.VER }}.apk
          make_latest: true
